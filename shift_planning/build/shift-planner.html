<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shift Planner</title>
<style>
/* ==========================================================================
   app.css — shell, shared controls, and the print rules.
   Each view ships its own CSS (exported as `css` from its module, injected
   by app.js) so a view can be added or dropped without touching this file.
   ========================================================================== */

:root{
  --ink:        #1b1b1b;
  --ink-2:      #5a5a5a;
  --ink-3:      #8a8a8a;
  --line:       #d9d9d9;
  --line-2:     #ececec;
  --paper:      #ffffff;
  --ground:     #f4f4f2;
  --accent:     #2a78d6;
  --accent-ink: #ffffff;
  --bad:        #c92a2a;
  --warn:       #b7791f;
  --good:       #2b8a3e;
  --off:        #FFE699;

  /* sequential blue ramp for magnitude (coverage) */
  --seq-0: #ffffff; --seq-1: #cde2fb; --seq-2: #9ec5f4; --seq-3: #6da7ec;
  --seq-4: #3987e5; --seq-5: #256abf; --seq-6: #184f95; --seq-7: #0d366b;

  --radius: 4px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, Consolas, "Cascadia Mono", monospace;
}

*{ box-sizing:border-box; }
html, body{ height:100%; }
body{
  margin:0; font:13px/1.35 var(--font); color:var(--ink); background:var(--ground);
  display:flex; flex-direction:column; overflow:hidden;
}
button, input, select, textarea{ font:inherit; color:inherit; }
button{
  background:var(--paper); border:1px solid var(--line); border-radius:var(--radius);
  padding:4px 10px; cursor:pointer; line-height:1.2;
}
button:hover{ border-color:#bbb; background:#fafafa; }
button:disabled{ opacity:.45; cursor:default; }
button.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
button.primary:hover{ background:#1c5cab; }
button.small{ padding:2px 7px; font-size:12px; }
button.quiet{ border-color:transparent; background:transparent; }
button.quiet:hover{ background:#eaeaea; }
input[type=text], input[type=date], input[type=number], select{
  border:1px solid var(--line); border-radius:var(--radius); padding:3px 6px; background:var(--paper);
}
input:focus, select:focus, button:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
h2{ font-size:14px; margin:0 0 8px; }
h3{ font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-2); margin:14px 0 6px; }
p.hint{ color:var(--ink-2); margin:4px 0 10px; }
kbd{ font:11px var(--mono); background:#eee; border:1px solid #ccc; border-bottom-width:2px; border-radius:3px; padding:0 4px; }
.muted{ color:var(--ink-3); }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.spacer{ flex:1; }

/* ---- top bar --------------------------------------------------------- */

#topbar{
  display:flex; align-items:center; gap:14px; padding:6px 12px;
  background:var(--paper); border-bottom:1px solid var(--line); flex:none;
}
#topbar .brand{ font-weight:700; font-size:15px; }
#topbar .week{ display:flex; align-items:center; gap:6px; }
#topbar .week #week-label{ font-weight:600; min-width:150px; }
#tabs{ display:flex; gap:2px; margin-left:8px; }
#tabs button{ border-color:transparent; background:transparent; padding:5px 11px; }
#tabs button:hover{ background:#eee; }
#tabs button.active{ background:var(--ink); color:#fff; }
#topbar .actions{ margin-left:auto; display:flex; gap:6px; align-items:center; }
#topbar #file-status{ font-size:11px; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-right:4px; }
#topbar #week-label{ font-weight:600; }
#banner{ background:#fff4d6; border-bottom:1px solid #e8c97a; padding:6px 12px; font-size:12px; }

/* ---- main split ------------------------------------------------------ */

#main{ flex:1; display:grid; grid-template-columns:1fr 380px; min-height:0; }
#view{ overflow:auto; padding:12px; min-width:0; }
#side{
  overflow-y:auto; overflow-x:hidden; padding:12px; background:var(--paper); border-left:1px solid var(--line);
}
#main.wide-view{ grid-template-columns:1fr; }
#main.wide-view #side{ display:none; }

/* ---- popup menu ------------------------------------------------------ */

#menu{
  position:fixed; z-index:50; background:var(--paper); border:1px solid var(--line);
  border-radius:6px; box-shadow:0 6px 24px rgba(0,0,0,.15); padding:4px; min-width:160px;
}
#menu button{
  display:flex; align-items:center; gap:8px; width:100%; text-align:left;
  border:none; background:none; padding:6px 10px; border-radius:4px;
}
#menu button:hover{ background:#f0f0f0; }
#menu hr{ border:none; border-top:1px solid var(--line-2); margin:4px 0; }
.swatch{ display:inline-block; width:14px; height:14px; border-radius:3px; border:1px solid rgba(0,0,0,.2); }

/* ---- modal (the roster-file prompt) ---------------------------------- */

#modal{
  position:fixed; inset:0; z-index:70; background:rgba(0,0,0,.35);
  display:flex; align-items:center; justify-content:center;
}
#modal[hidden]{ display:none; }   /* display:flex above would beat the attribute */
#modal .box{
  background:var(--paper); border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,.25);
  padding:22px 26px; width:420px; max-width:92vw;
}
#modal h2{ font-size:16px; margin:0 0 6px; }
#modal p{ margin:6px 0 14px; color:var(--ink-2); }
#modal .choices{ display:flex; flex-direction:column; gap:8px; align-items:flex-start; }
#modal .choices button.primary{ padding:8px 16px; font-size:14px; }
#modal .choices button.quiet{ font-size:12px; color:var(--ink-2); padding:2px 6px; }

/* ---- shared: pills & warnings ---------------------------------------- */

.pill{ display:inline-block; font-size:11px; padding:0 6px; border-radius:9px; background:#eee; color:var(--ink-2); }
.pill.casual{ background:#e9f0fb; color:#1c5cab; }
.warnlist{ list-style:none; padding:0; margin:0; }
.warnlist li{ padding:3px 0 3px 18px; position:relative; }
.warnlist li::before{ content:''; position:absolute; left:2px; top:8px; width:9px; height:9px; border-radius:50%; }
.warnlist li.bad::before{ background:var(--bad); }
.warnlist li.warn::before{ background:var(--warn); }
.warnlist li.good::before{ background:var(--good); }

/* ---- print ----------------------------------------------------------- */

#print-root{ display:none; }

@media print{
  @page{ margin:0; }
  body{ background:#fff; overflow:visible; display:block; }
  #topbar, #main, #menu{ display:none !important; }
  #print-root{ display:block; }
  #print-root svg{ display:block; page-break-after:always; break-after:page; }
  #print-root svg:last-child{ page-break-after:auto; break-after:auto; }
}

</style>
</head>
<body>

<header id="topbar">
  <div class="brand">Shift planner</div>
  <div class="week">
    <button id="week-prev" title="Previous week">◀</button>
    <button id="week-label" class="quiet" title="Jump to this week"></button>
    <button id="week-next-arrow" title="Following week">▶</button>
    <button id="week-next" class="small" title="Jump to next week — the one usually being planned">Next week</button>
  </div>
  <nav id="tabs"></nav>
  <div class="actions">
    <span id="file-status" class="muted" title="Where the roster is saved"></span>
    <button id="undo" title="Undo (Ctrl+Z)">↶</button>
    <button id="redo" title="Redo (Ctrl+Y)">↷</button>
    <button id="print-day" class="primary" title="Print the roster by day, for management">Print by day</button>
    <button id="print-staff" class="primary" title="Print the roster by person, for the staff room">Print by staff</button>
    <button id="more" title="File, import, export, reset">⋯</button>
  </div>
</header>

<div id="banner" hidden></div>

<main id="main">
  <section id="view"></section>
  <aside id="side"></aside>
</main>

<div id="menu" hidden></div>
<div id="modal" hidden></div>
<div id="print-root"></div>

.wt-wrap{ background:var(--paper); border:1px solid var(--line); border-radius:6px; overflow:auto; outline:none; }
.wt-wrap:focus-visible{ box-shadow:0 0 0 2px var(--accent); }
table.wt{ border-collapse:separate; border-spacing:0; width:100%; min-width:720px; }
table.wt th, table.wt td{ border-bottom:1px solid var(--line-2); border-right:1px solid var(--line-2); padding:0; }
table.wt th{ background:#fafafa; font-weight:600; text-align:left; padding:6px 8px; vertical-align:bottom; position:sticky; top:0; z-index:2; }
table.wt th.day{ text-align:center; }
table.wt th.day .date{ display:block; font-weight:400; color:var(--ink-2); font-size:11px; }
table.wt th.end{ text-align:right; }
table.wt td.name{ padding:0 8px; white-space:nowrap; position:sticky; left:0; background:var(--paper); z-index:1; }
table.wt td.name .pill{ margin-left:5px; }
table.wt tr.group td{ background:#f0f0ee; color:var(--ink-2); font-size:11px; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; }
table.wt td.cell{ position:relative; width:84px; text-align:center; cursor:cell; user-select:none; }
table.wt td.cell .t{ display:block; padding:5px 6px; min-height:26px; line-height:16px; }
table.wt td.cell.note .t{ color:var(--warn); font-style:italic; }
table.wt td.cell.selected{ box-shadow:inset 0 0 0 2px var(--accent); z-index:1; }
table.wt td.cell.unavail::after{
  content:''; position:absolute; top:0; right:0; border-style:solid; border-width:0 9px 9px 0;
  border-color:transparent var(--bad) transparent transparent;
}
table.wt td.end{ text-align:right; padding:0 8px; white-space:nowrap; color:var(--ink-2); font-variant-numeric:tabular-nums; }
table.wt td.end.over{ color:var(--bad); font-weight:600; }
.wt-wrap.painting td.cell{ cursor:copy; }

.wt-palette{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
.wt-palette .lab{ font-size:11px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.05em; margin:0 4px; }
.wt-palette button{ padding:2px 9px; font-size:12px; }
.wt-palette button.armed{ outline:2px solid var(--accent); outline-offset:1px; font-weight:600; }
.wt-palette button.tag{ display:inline-flex; align-items:center; gap:4px; }

.wt-editor{
  position:fixed; z-index:60; width:236px; background:var(--paper); border:1px solid var(--line);
  border-radius:6px; box-shadow:0 8px 28px rgba(0,0,0,.16); padding:6px;
}
.wt-editor input{ width:100%; text-align:center; font-size:14px; padding:4px 6px; }
.wt-editor .why{ font-size:11px; color:var(--bad); margin:4px 2px 0; }
.wt-editor ul{ list-style:none; margin:6px 0 0; padding:0; max-height:220px; overflow:auto; }
.wt-editor li{ display:flex; align-items:center; gap:8px; padding:4px 8px; border-radius:4px; cursor:pointer; }
.wt-editor li.hi{ background:var(--accent); color:#fff; }
.wt-editor li .hrs{ margin-left:auto; font-size:11px; opacity:.7; }
.wt-editor li.custom .hrs::before{ content:'custom \xB7 '; }
.wt-editor .chips{ display:flex; gap:4px; flex-wrap:wrap; margin-top:6px; padding-top:6px; border-top:1px solid var(--line-2); }
.wt-editor .chips button{ padding:2px 7px; font-size:11px; }
.wt-editor .chips button.tag{ display:inline-flex; align-items:center; gap:4px; }
.wt-editor .chips button.tag.on{ border-color:var(--ink); box-shadow:inset 0 0 0 1px var(--ink); }
.wt-editor .keys{ font-size:10px; color:var(--ink-3); margin-top:6px; }
