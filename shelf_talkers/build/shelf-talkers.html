   Two blocks below:
     1. APP CHROME   — the editor UI. Never printed.
     2. SHEET        — the artwork. Printed. All geometry in mm / cell-relative.
   ========================================================================== */

:root{
  /* ---- typefaces -------------------------------------------------------
     Talker-* are subsetted woff2 faces base64'd into this file by build.js,
     so the output is identical on any machine. The local names after them
     are only a safety net if a build ever ships without the fonts.
       Talker-Slab   = Cooper Black   (kept, but nothing asks for it now:
                                       BRILLIANT BUYS moved to Talker-Black)
       Talker-Black  = Arial Black
       Talker-Narrow = Arial Narrow Bold
       Talker-Item   = Times New Roman Bold Italic                         */
  --f-slab:   'Talker-Slab',   'Cooper Black', Georgia, serif;       /* unused — see below      */
  --f-black:  'Talker-Black',  'Arial Black', Impact, sans-serif;    /* BEST BUY headline       */
  --f-narrow: 'Talker-Narrow', 'Arial Narrow', Arial, sans-serif;    /* small print             */
  --f-item:   'Talker-Item',   'Times New Roman', Georgia, serif;    /* name / price / detail   */
  --f-wool:   'Talker-Black',  'Arial Black', sans-serif;            /* WOOL column wordmark    */

  /* ---- design colours ---------------------------------------------------
     BEST BUY and BRILLIANT BUYS both run the house palette. Sampled straight
     out of the OK Foods artwork: the panel green, the logo red, white.
     The green is lifted from the artwork's #074531: that printed near-black
     on the shop's printers, and the red headline was lost against it.     */
  --ok-green:  #1a7a50;
  --ok-red:    #EB1D24;
  --ok-white:  #ffffff;

  /* The green panels. designs.js draws BEST BUY's as a two-stop ramp; both
     stops are the same green because the reference artwork is flat. Give
     them different values here to bring a gradient back. */
  --bb-panel-from: var(--ok-green);
  --bb-panel-to:   var(--ok-green);
  --brill-bar:     var(--ok-green);

  /* Both promo headlines are red on that green with a solid white outline
     and no shadow. Flat red on this green measures about 2.5:1, so the
     outline is what carries the headline across a shop floor — keep it if
     you move either colour. */
  --promo-headline: var(--ok-red);
  --promo-outline:  var(--ok-white);

  /* Sampled straight out of wool.png — the bar must match the logo's own
     background exactly or a seam shows where the two meet. */
  --wool-blue:  #1b9ed2;
  --wool-pink:  #F09BE0;

  /* ---- sheet ------------------------------------------------------------ */
  /* --sheet-margin is set per sheet by app.js from SHEET_MARGIN_MM in layout.js */
  --hairline: 0.2mm;
  --hairline-ink: #c2c2c2;

  /* ---- UI --------------------------------------------------------------- */
  --ink:#171a1f; --muted:#6b7280; --rule:#e4e7eb; --bg:#f4f6f8; --card:#fff;
  --accent:#1668c7; --danger:#c0392b;
}

/* ==========================================================================
   1. APP CHROME
   ========================================================================== */

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}

#app{display:flex;flex-direction:column;height:100vh}

.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--card);
        border-bottom:1px solid var(--rule);flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.02em}
.topbar-spacer{flex:1}
.print-hint{font-size:12px;color:var(--muted)}
.print-hint b{color:var(--ink);font-weight:600}

.btn{font:inherit;border:1px solid var(--rule);background:#fff;color:var(--ink);
     padding:7px 13px;border-radius:7px;cursor:pointer}
.btn:hover{background:#f1f3f5}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-primary:hover{background:#12579f}
.btn-ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 10px}
.btn-ghost:hover{background:#eceff2;color:var(--ink)}
.btn-danger:hover{color:var(--danger)}

.panes{flex:1;display:grid;grid-template-columns:minmax(430px,1fr) minmax(380px,42%);
       min-height:0}
.pane{min-height:0;overflow:auto}
.pane-left{background:var(--card);border-right:1px solid var(--rule);padding:14px 16px 40px}
.pane-right{background:#e9edf1;padding:0}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;margin-bottom:16px}
.ctl{display:flex;flex-direction:column;gap:5px}
.ctl-label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.check{display:flex;align-items:center;gap:6px;font-size:13px;padding-bottom:7px;cursor:pointer}

.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg button{font:inherit;font-size:12.5px;border:0;background:#fff;padding:8px 12px;cursor:pointer;
            border-right:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.seg-sm button{padding:5px 12px;font-size:12px}

.layout-btn{display:flex;align-items:center;gap:9px;font:inherit;background:#fff;cursor:pointer;
            border:1px solid var(--rule);border-radius:8px;padding:5px 10px 5px 6px}
.layout-btn:hover{background:#f1f3f5}
.layout-btn-thumb{display:block;width:22px;height:30px}
.layout-btn-text{font-size:13px}
.caret{color:var(--muted);font-size:11px}

/* ---- layout popover ---- */
.pop{position:absolute;z-index:50;background:#fff;border:1px solid var(--rule);border-radius:12px;
     box-shadow:0 12px 34px rgba(16,24,40,.18);padding:12px;width:344px}
.pop-head{display:flex;justify-content:center;margin-bottom:10px}
.pop-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lay{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 4px;border-radius:8px;
     border:1px solid transparent;background:transparent;cursor:pointer;font:inherit}
.lay:hover{background:#f1f3f5}
.lay[aria-pressed="true"]{border-color:var(--accent);background:#eaf2fc}
.lay svg{display:block}
.lay span{font-size:11px;color:var(--muted)}
.lay[aria-pressed="true"] span{color:var(--accent);font-weight:600}
.pop-foot{display:flex;align-items:center;gap:7px;margin-top:11px;padding-top:11px;
          border-top:1px solid var(--rule);font-size:12.5px;color:var(--muted)}
.pop-foot input{width:52px;font:inherit;padding:5px 7px;border:1px solid var(--rule);border-radius:6px}

/* ---- item table ---- */
/* Name was taking every spare pixel while Price — which holds two lines
   often enough to matter — was pinned narrow. All three text columns are
   fractional now, so the balance holds at any pane width instead of only the
   wide one. minmax(0,…) rather than a bare fr: a grid item's default minimum
   is min-content, so one long unbreakable word would otherwise stretch its
   track and squeeze the others. */
.table-head,.row{display:grid;
  grid-template-columns:26px minmax(0,1.5fr) minmax(0,1fr) minmax(0,.75fr) 58px;
  gap:8px;align-items:start}
.table-head{padding:0 2px 6px}
.th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.rows{display:flex;flex-direction:column;gap:6px}
.row{padding:2px;border-radius:8px}
.row.dragging{opacity:.4}
.row.drop-before{box-shadow:0 -2px 0 var(--accent)}
.row.drop-after{box-shadow:0 2px 0 var(--accent)}
.grip{cursor:grab;color:#b6bcc4;text-align:center;padding-top:8px;user-select:none;font-size:15px}
.row input,.row textarea{font:inherit;width:100%;padding:7px 9px;border:1px solid var(--rule);
     border-radius:7px;background:#fff;color:var(--ink);text-transform:uppercase}
/* autoGrow() in app.js sets the height from scrollHeight on every keystroke,
   so the box is always exactly as tall as its content — hence overflow:hidden
   (there is nothing to scroll to) and resize:none (a dragged height would be
   overwritten by the next character typed). */
.row textarea{resize:none;min-height:36px;line-height:1.3;overflow:hidden}
.row input:focus,.row textarea:focus{outline:2px solid #b9d4f5;outline-offset:-1px;border-color:var(--accent)}
.row-acts{display:flex;gap:2px;padding-top:3px}
.icon-btn{border:0;background:transparent;color:#aab0b8;cursor:pointer;font-size:14px;padding:4px 5px;
          border-radius:6px;line-height:1}
.icon-btn:hover{background:#eceff2;color:var(--ink)}
.icon-btn.del:hover{color:var(--danger)}

.table-foot{display:flex;align-items:center;gap:4px;margin-top:12px}
.save-state{margin-left:auto;font-size:11.5px;color:var(--muted)}
.tip{margin:14px 2px 0;font-size:11.5px;color:var(--muted);line-height:1.6}
.tip b{color:#4b5563}

/* ---- preview ---- */
.preview-bar{position:sticky;top:0;z-index:5;background:#e9edf1;padding:9px 16px;
             border-bottom:1px solid #d7dde3}
.preview-info{font-size:12px;color:var(--muted)}
.preview{padding:16px}
.sheet-wrap{position:relative;margin:0 auto 16px;filter:drop-shadow(0 3px 10px rgba(16,24,40,.16))}

/* ==========================================================================
   2. SHEET  (printed artwork)
   ========================================================================== */

/* On screen the sheet is the whole piece of paper, with the blank border
   drawn inside it, so the preview shows what comes out of the printer.
   In print the sheet is just the grid: @page carries the border instead
   (see the print block). Both come from the same mm figures in layout.js
   and the cell works out the same size either way. */
.sheet{position:relative;background:#fff;overflow:hidden;
       width:var(--paper-w);height:var(--paper-h);
       transform:scale(var(--scale,1));transform-origin:top left}

.grid{position:absolute;inset:var(--sheet-margin);display:grid}

/* Cells butt together; a hairline sits on internal shared edges only. */
/* min-*:0 matters: grid items default to min-content sizing, which would let
   an oversized text block stretch its track and break every measurement. */
.cell{position:relative;overflow:hidden;min-width:0;min-height:0;
      border-right:var(--hairline) solid var(--hairline-ink);
      border-bottom:var(--hairline) solid var(--hairline-ink)}
.cell.last-col{border-right:0}
.cell.last-row{border-bottom:0}
.cell.empty{background:#fff}

/* Every coloured panel is an inline SVG layer, never a CSS background, so it
   prints whether or not the browser's "Background graphics" box is ticked. */
.panel{position:absolute;inset:0;width:100%;height:100%;display:block}

/* Text slots are absolutely positioned in % of the cell and hold a single
   fitted block. fit.js sets font-size; nothing here may set it. */
.slot{position:absolute;display:flex;overflow:hidden;text-transform:uppercase}
.slot > .txt{width:100%}
.slot.va-c{align-items:center} .slot.va-t{align-items:flex-start} .slot.va-b{align-items:flex-end}
.slot.ha-c{justify-content:center} .slot.ha-l{justify-content:flex-start} .slot.ha-r{justify-content:flex-end}
.slot.ha-c > .txt{text-align:center} .slot.ha-l > .txt{text-align:left} .slot.ha-r > .txt{text-align:right}

/* Small print sits on the floor of its band in every design, rather than
   floating in the middle of it. Its band is sized for the longest blurb, so
   a centred short one drifts and reads as a stray line; pinned to the bottom
   it reads as a footer whatever it says, and the slack collects above it
   where the sign wants air anyway. One rule for all three designs — it wins
   over the .va-c the slot() helper defaults to because it comes later at
   equal specificity. BRILLIANT BUYS is unaffected: its blurb is rotated
   inside an absolutely-positioned .blurb-rot, which align-items cannot move. */
.slot.blurb{align-items:flex-end}
.slot .nowrap{white-space:nowrap}
.slot .line{white-space:nowrap}

/* Price stack: line-height here must match LINE_H in fit.js. flex:none stops
   the flex container squashing lines that are deliberately oversized. */
.price-stack{flex-direction:column}
.price-stack > .line{line-height:1.05;flex:none;width:100%}

/* ---- the headline both promo designs share ----
   Heavy sans, all caps (the .slot rule uppercases), red with a solid white
   outline. Set on the slot rather than the text so it covers both shapes:
   BEST BUY wide stacks BEST/BUY as two .line children, BRILLIANT BUYS is one
   .txt — every property here inherits, paint-order included. The stroke is
   in em so it stays proportional as fit.js resizes the headline across
   layouts, and paint-order puts it behind the fill; without that the stroke
   is centred on the outline and eats half the letterform. */
.d-bestbuy .headline,.d-brilliant .headline{
  font-family:var(--f-black);color:var(--promo-headline);line-height:.94}
/* Anything sized in em has to sit on the text, not the slot: fit.js sets
   font-size on the .txt child, while the slot keeps the 14px it inherited.
   An em on the slot resolves against that 14px and inherits down as a frozen
   pixel value — the outline would stop tracking the headline and print
   proportionally twice as heavy at 8-up as at 1-up.
   line-height deliberately stays above: on .txt it would outrank
   .price-stack > .line and desync BEST BUY's stacked headline from LINE_H.
   paint-order puts the stroke behind the fill; centred on the outline it
   would eat half the letterform. */
.d-bestbuy .headline > .txt,.d-brilliant .headline > .txt{
  letter-spacing:-.01em;-webkit-text-stroke:0.12em var(--promo-outline);
  paint-order:stroke fill}

/* ---- BEST BUY ---- */
/* Footer on the white, so black; balance evens out the lines it wraps to. */
.d-bestbuy .blurb{font-family:var(--f-narrow);font-weight:700;color:#000;line-height:1.25;
  text-wrap:balance}
.slot .phrase{white-space:nowrap}
.d-bestbuy .name,.d-bestbuy .price,.d-bestbuy .detail{
  font-family:var(--f-item);font-weight:700;font-style:italic;color:#000}
/* Wrapped names read as one block only when set tight; the font's normal
   line-height leaves a stray-looking gap under the first line. */
.d-bestbuy .name,.d-brilliant .name,.d-wool .name{line-height:1.1}
.d-bestbuy .price{line-height:1.02}

/* ---- BRILLIANT BUYS ---- */
.d-brilliant .blurb{font-family:var(--f-narrow);font-weight:700;color:#000;line-height:1.25}
/* The rotated small print is positioned, not flexed: as a flex child its
   pre-rotation width would be shrunk to the narrow strip and collapse. */
.d-brilliant .blurb-rot{position:absolute;left:50%;top:50%;
  transform:translate(-50%,-50%) rotate(-90deg);display:flex;align-items:center;
  justify-content:center;text-align:center}
.d-brilliant .name,.d-brilliant .price,.d-brilliant .detail{
  font-family:var(--f-item);font-weight:700;font-style:italic;color:#000}

/* ---- WOOL AND MORE ---- */
.d-wool .logo{position:absolute;display:block}
.d-wool .wordmark{font-family:var(--f-wool);font-weight:700;color:#fff;line-height:1.05;
                  letter-spacing:.02em}
.d-wool .blurb{font-family:var(--f-narrow);font-weight:700;color:#fff;line-height:1.25}
.d-wool .name,.d-wool .price,.d-wool .detail{font-family:var(--f-item);font-weight:700;color:#000}

/* ==========================================================================
   PRINT
   ========================================================================== */
/* Print sheets are built off-screen rather than display:none — they must be
   laid out for fit.js to measure them, so they are positioned away instead. */
#print-root{position:absolute;left:-100000px;top:0;width:1400px}

@media print{
  /* @page size/orientation/margin is injected by app.js into #page-rule.
     The border is split: @page holds as much of it as Chrome will take
     without filling the margin with its own date/title/filename furniture,
     and --print-inset holds the remainder. Both numbers come from the
     margin block in layout.js, which is where the reasoning lives. */
  html,body{height:auto;background:#fff}
  #app{display:none !important}
  #print-root{position:static;left:auto;width:auto}
  .sheet-wrap{margin:0;filter:none}
  .sheet{width:var(--area-w);height:var(--area-h);
         transform:none !important;box-shadow:none;
         break-after:page;page-break-after:always}
  .grid{inset:var(--print-inset)}
  .sheet:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

</style>

<body>

<div id="app">

  <header class="topbar">
    <div class="brand">Shelf&nbsp;Talkers</div>
    <div class="topbar-spacer"></div>
    <div class="print-hint">
      In the print dialog leave <b>Margins: Default</b> and set <b>Scale: 100%</b>
      &mdash; not <b>Fit to printable area</b>, which shifts the page
    </div>
    <button id="btn-print" class="btn btn-primary">Print&nbsp;/&nbsp;Save&nbsp;PDF</button>
  </header>

  <main class="panes">

    <!-- ============ LEFT: DATA ENTRY ============ -->
    <section class="pane pane-left">

      <div class="controls">
        <div class="ctl">
          <label class="ctl-label">Design</label>
          <div class="seg" id="design-seg"></div>
        </div>

        <div class="ctl">
          <label class="ctl-label">Layout</label>
          <button id="layout-btn" class="layout-btn" type="button" aria-haspopup="dialog">
            <span class="layout-btn-thumb" id="layout-btn-thumb"></span>
            <span class="layout-btn-text" id="layout-btn-text">1 × 3</span>
            <span class="caret">▾</span>
          </button>
        </div>

        <div class="ctl ctl-tight">
          <label class="ctl-label">&nbsp;</label>
          <label class="check"><input type="checkbox" id="chk-blurb" checked> Small print</label>
        </div>

        <div class="ctl ctl-tight">
          <label class="ctl-label">&nbsp;</label>
          <label class="check" title="A wider blank border around the page — not remembered next time">
            <input type="checkbox" id="chk-margin" autocomplete="off"> Wide margins</label>
        </div>
      </div>

      <div class="table-head">
        <span class="th th-grip"></span>
        <span class="th">Name</span>
        <span class="th">Price</span>
        <span class="th">Detail</span>
        <span class="th th-acts"></span>
      </div>

      <div id="rows" class="rows"></div>

      <div class="table-foot">
        <button id="btn-add" class="btn btn-ghost" type="button">+ Add item</button>
        <button id="btn-example" class="btn btn-ghost" type="button">Load example items</button>
        <button id="btn-clear" class="btn btn-ghost btn-danger" type="button">Clear all</button>
        <span class="save-state" id="save-state"></span>
      </div>

      <p class="tip">
        <b>Tab</b> moves across · <b>Enter</b> starts a new line in any cell
        (each price line is sized on its own) · <b>Ctrl+Enter</b> adds a row ·
        drag <b>⠿</b> to reorder
      </p>
    </section>

    <!-- ============ RIGHT: PREVIEW ============ -->
    <section class="pane pane-right">
      <div class="preview-bar">
        <span id="preview-info" class="preview-info"></span>
      </div>
      <div id="preview" class="preview"></div>
    </section>

  </main>

  <!-- ============ LAYOUT PICKER POPOVER ============ -->
  <div id="layout-pop" class="pop" hidden>
    <div class="pop-head">
      <div class="seg seg-sm" id="orient-seg"></div>
    </div>
    <div class="pop-grid" id="layout-grid"></div>
    <div class="pop-foot">
      <label>Custom</label>
      <input type="number" id="custom-cols" min="1" max="12" value="1"> ×
      <input type="number" id="custom-rows" min="1" max="12" value="3">
      <button class="btn btn-ghost" id="custom-apply" type="button">Apply</button>
    </div>
  </div>

</div>

<!-- print target: sheets are moved here at print time so nothing else can leak onto the page -->
<div id="print-root"></div>
